<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>16進数・ビット演算 学習ゲーム</title><script src="https://cdn.tailwindcss.com"></script><style>  .bit-cell { transition: background-color 0.15s; }  .bit-cell:focus { outline: 3px solid #6366f1; outline-offset: 2px; }  .fade-in { animation: fadeIn 0.3s ease-in; }  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }  .shake { animation: shake 0.4s; }  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }  .pulse-correct { animation: pulseCorrect 0.5s; }  @keyframes pulseCorrect { 0%{background-color:inherit} 50%{background-color:#bbf7d0} 100%{background-color:inherit} }</style></head><body class="bg-gray-900 text-gray-100 min-h-screen font-mono"><div id="app" class="max-w-2xl mx-auto px-4 py-6">  <!-- Header -->  <header class="text-center mb-6">    <h1 class="text-2xl font-bold text-indigo-400">16進数・ビット演算 学習ゲーム</h1>    <p class="text-gray-400 text-sm mt-1">Hex &amp; Bitwise Operations Learning Game</p>  </header>  <!-- Menu Screen -->  <div id="screen-menu" class="fade-in">    <div class="grid gap-4 mb-6">      <button onclick="startGame('conversion')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-6 rounded-xl text-left transition" aria-label="変換チャレンジモードを開始">        <div class="text-lg">🔢 変換チャレンジ</div>        <div class="text-sm text-indigo-200 mt-1">10進数 ↔ 16進数 ↔ 2進数の変換練習</div>      </button>      <button onclick="startGame('bitwise')" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-6 rounded-xl text-left transition" aria-label="ビット演算クイズモードを開始">        <div class="text-lg">⚙️ ビット演算クイズ</div>        <div class="text-sm text-purple-200 mt-1">AND/OR/XOR/NOT/シフト演算の計算練習</div>      </button>      <button onclick="startGame('flags')" class="bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-6 rounded-xl text-left transition" aria-label="ビットフラグモードを開始">        <div class="text-lg">🚩 ビットフラグ</div>        <div class="text-sm text-green-200 mt-1">フラグのセット/クリアでターゲット値を再現</div>      </button>    </div>    <!-- High Scores -->    <div class="bg-gray-800 rounded-xl p-4" role="region" aria-label="ハイスコア">      <h2 class="text-indigo-400 font-bold mb-3">🏆 ハイスコア</h2>      <div id="high-scores-display" class="grid grid-cols-3 gap-3 text-center text-sm"></div>    </div>  </div>  <!-- Conversion Challenge Screen -->  <div id="screen-conversion" class="hidden fade-in">    <div class="flex justify-between items-center mb-4">      <button onclick="goMenu()" class="text-gray-400 hover:text-white transition" aria-label="メニューに戻る">← メニュー</button>      <div class="flex gap-4 text-sm">        <span>スコア: <strong id="conv-score" class="text-yellow-400">0</strong></span>        <span>残り: <strong id="conv-timer" class="text-red-400">30</strong>秒</span>      </div>    </div>    <!-- Difficulty Select -->    <div id="conv-difficulty" class="bg-gray-800 rounded-xl p-4 mb-4">      <h2 class="text-center font-bold mb-3 text-indigo-300">難易度を選択</h2>      <div class="grid grid-cols-3 gap-3">        <button onclick="startConversion('easy')" class="bg-green-700 hover:bg-green-600 py-2 px-3 rounded-lg text-sm transition">簡単<br><span class="text-xs text-green-200">0–255</span></button>        <button onclick="startConversion('medium')" class="bg-yellow-700 hover:bg-yellow-600 py-2 px-3 rounded-lg text-sm transition">普通<br><span class="text-xs text-yellow-200">0–65535</span></button>        <button onclick="startConversion('hard')" class="bg-red-700 hover:bg-red-600 py-2 px-3 rounded-lg text-sm transition">難しい<br><span class="text-xs text-red-200">32ビット</span></button>      </div>    </div>    <div id="conv-game" class="hidden">      <div class="bg-gray-800 rounded-xl p-5 mb-4 text-center">        <div id="conv-question-type" class="text-xs text-gray-400 mb-2"></div>        <div id="conv-number" class="text-4xl font-bold text-white mb-2"></div>        <div id="conv-format" class="text-sm text-gray-400"></div>      </div>      <div class="flex gap-2 mb-4">        <input id="conv-input" type="text" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white text-lg focus:border-indigo-400 focus:outline-none uppercase" placeholder="答えを入力..." aria-label="変換の答えを入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">        <button onclick="checkConversion()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-bold transition" aria-label="答えを確認">送信</button>      </div>      <div id="conv-feedback" class="text-center min-h-8 text-sm"></div>    </div>  </div>  <!-- Bitwise Quiz Screen -->  <div id="screen-bitwise" class="hidden fade-in">    <div class="flex justify-between items-center mb-4">      <button onclick="goMenu()" class="text-gray-400 hover:text-white transition" aria-label="メニューに戻る">← メニュー</button>      <div class="flex gap-4 text-sm">        <span>スコア: <strong id="bw-score" class="text-yellow-400">0</strong></span>        <span>問題: <strong id="bw-qnum" class="text-indigo-400">1</strong>/10</span>      </div>    </div>    <div id="bw-question-card" class="bg-gray-800 rounded-xl p-5 mb-4">      <div class="text-center mb-4">        <div id="bw-op-label" class="text-2xl font-bold text-purple-400 mb-3"></div>        <div id="bw-operands" class="text-xl font-mono"></div>      </div>      <div class="flex gap-2 mb-2">        <input id="bw-input" type="text" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white text-lg focus:border-purple-400 focus:outline-none uppercase" placeholder="16進数で答えを入力..." aria-label="ビット演算の答えを入力" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">        <button onclick="checkBitwise()" class="bg-purple-600 hover:bg-purple-500 px-6 py-3 rounded-lg font-bold transition" aria-label="答えを確認">送信</button>      </div>      <div id="bw-feedback" class="text-center text-sm min-h-6"></div>    </div>    <div id="bw-breakdown" class="hidden bg-gray-800 rounded-xl p-4 mb-4 fade-in">      <h3 class="text-purple-300 font-bold mb-3">2進数の内訳</h3>      <div id="bw-breakdown-content" class="text-sm font-mono"></div>      <button onclick="nextBitwiseQuestion()" class="mt-4 w-full bg-purple-600 hover:bg-purple-500 py-2 rounded-lg font-bold transition">次の問題 →</button>    </div>  </div>  <!-- Bit Flags Screen -->  <div id="screen-flags" class="hidden fade-in">    <div class="flex justify-between items-center mb-4">      <button onclick="goMenu()" class="text-gray-400 hover:text-white transition" aria-label="メニューに戻る">← メニュー</button>      <div class="flex gap-4 text-sm">        <span>スコア: <strong id="flag-score" class="text-yellow-400">0</strong></span>        <span>問題: <strong id="flag-qnum" class="text-green-400">1</strong>/8</span>      </div>    </div>    <div class="bg-gray-800 rounded-xl p-5 mb-4">      <div class="text-center mb-4">        <div class="text-sm text-gray-400 mb-1">ターゲット値</div>        <div id="flag-target-hex" class="text-3xl font-bold text-green-400"></div>        <div id="flag-target-bin" class="text-sm text-gray-400 mt-1"></div>      </div>      <div class="mb-4">        <div class="text-xs text-gray-400 text-center mb-2">フラグをクリックしてON/OFFを切り替え</div>        <div id="flag-bits" class="grid grid-cols-8 gap-1" role="group" aria-label="8ビットフラグ入力"></div>        <div id="flag-bit-labels" class="grid grid-cols-8 gap-1 mt-1 text-center text-xs text-gray-500"></div>      </div>      <div class="flex justify-between items-center text-sm">        <span class="text-gray-400">現在の値:</span>        <span id="flag-current" class="font-mono text-white text-lg"></span>      </div>    </div>    <div id="flag-feedback" class="text-center text-sm min-h-6 mb-3"></div>    <button onclick="checkFlags()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-bold transition mb-2">確認する</button>    <div id="flag-tip" class="hidden bg-gray-800 rounded-xl p-4 mt-3 fade-in">      <div id="flag-tip-content" class="text-sm text-gray-300"></div>      <button onclick="nextFlagQuestion()" class="mt-3 w-full bg-green-600 hover:bg-green-500 py-2 rounded-lg font-bold transition">次の問題 →</button>    </div>  </div>  <!-- Result Screen -->  <div id="screen-result" class="hidden fade-in text-center">    <div class="bg-gray-800 rounded-xl p-8 mb-4">      <div id="result-emoji" class="text-6xl mb-4"></div>      <h2 id="result-title" class="text-2xl font-bold mb-2"></h2>      <div id="result-score" class="text-4xl font-bold text-yellow-400 mb-2"></div>      <div id="result-detail" class="text-gray-400 text-sm mb-4"></div>      <div id="result-new-record" class="hidden text-green-400 font-bold mb-4">🎉 新記録！</div>    </div>    <button onclick="goMenu()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">メニューに戻る</button>  </div></div><script>function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }// ===== State =====let state = {  mode: null,  score: 0,  currentQ: 0,  timerInterval: null,  timeLeft: 30,  difficulty: 'easy',  currentAnswer: null,  currentOp: null,  currentA: 0,  currentB: 0,  flagBits: new Array(8).fill(0),  flagTarget: 0,  totalQuestions: 0,  correctCount: 0,};const FLAG_NAMES = ['CF','PF','AF','ZF','SF','TF','IF','OF'];const BIT_TIPS = {  AND: 'ANDは両方のビットが1の場合のみ1になります。マスク操作に使います。',  OR:  'ORはどちらかのビットが1なら1になります。フラグのセットに使います。',  XOR: 'XORはビットが異なる場合に1になります。フラグの反転やスワップに使います。',  NOT: 'NOTは全ビットを反転します（0→1, 1→0）。補数の計算に使います。',  LSHIFT: '左シフト(<<)は2の乗数の掛け算と同じです。n回シフトで2^n倍。',  RSHIFT: '右シフト(>>)は2の乗数の割り算と同じです。n回シフトで2^n分の1。',};// ===== localStorage =====function getHighScores() {  try { return JSON.parse(localStorage.getItem('hexgame_scores') || '{}'); } catch { return {}; }}function saveHighScore(mode, score) {  const scores = getHighScores();  if (!scores[mode] || score > scores[mode]) { scores[mode] = score; localStorage.setItem('hexgame_scores', JSON.stringify(scores)); return true; }  return false;}function renderHighScores() {  const scores = getHighScores();  const modes = [{key:'conversion',label:'変換',color:'indigo'},{key:'bitwise',label:'演算',color:'purple'},{key:'flags',label:'フラグ',color:'green'}];  document.getElementById('high-scores-display').innerHTML = modes.map(m => ` // xss-ok: internal constant    <div class="bg-gray-700 rounded-lg py-2 px-3">      <div class="text-xs text-gray-400">${m.label}</div>      <div class="text-lg font-bold text-${m.color}-400">${scores[m.key] || 0}</div>    </div>`).join('');}// ===== Navigation =====function showScreen(id) {  ['menu','conversion','bitwise','flags','result'].forEach(s => {    const el = document.getElementById('screen-'+s);    if (el) el.classList.add('hidden');  });  document.getElementById('screen-'+id).classList.remove('hidden');}function goMenu() {  clearInterval(state.timerInterval);  state.mode = null;  renderHighScores();  showScreen('menu');}function startGame(mode) {  state.mode = mode;  state.score = 0;  state.correctCount = 0;  state.totalQuestions = 0;  if (mode === 'conversion') {    document.getElementById('conv-score').textContent = '0';    document.getElementById('conv-timer').textContent = '30';    document.getElementById('conv-game').classList.add('hidden');    document.getElementById('conv-difficulty').classList.remove('hidden');    showScreen('conversion');  } else if (mode === 'bitwise') {    state.currentQ = 0;    document.getElementById('bw-score').textContent = '0';    document.getElementById('bw-qnum').textContent = '1';    showScreen('bitwise');    nextBitwiseQuestion();  } else if (mode === 'flags') {    state.currentQ = 0;    document.getElementById('flag-score').textContent = '0';    document.getElementById('flag-qnum').textContent = '1';    showScreen('flags');    nextFlagQuestion();  }}// ===== Conversion Challenge =====function startConversion(diff) {  state.difficulty = diff;  state.score = 0;  state.timeLeft = 30;  document.getElementById('conv-score').textContent = '0';  document.getElementById('conv-timer').textContent = '30';  document.getElementById('conv-difficulty').classList.add('hidden');  document.getElementById('conv-game').classList.remove('hidden');  document.getElementById('conv-feedback').textContent = '';  nextConvQuestion();  clearInterval(state.timerInterval);  state.timerInterval = setInterval(() => {    state.timeLeft--;    document.getElementById('conv-timer').textContent = state.timeLeft;    if (state.timeLeft <= 0) {      clearInterval(state.timerInterval);      endGame('conversion');    }  }, 1000);}function randomConvNumber() {  if (state.difficulty === 'easy') return Math.floor(Math.random() * 256);  if (state.difficulty === 'medium') return Math.floor(Math.random() * 65536);  return Math.floor(Math.random() * 4294967296);}function nextConvQuestion() {  const n = randomConvNumber();  const type = Math.random() < 0.5 ? 'dec2hex' : 'hex2dec';  state.currentAnswer = n;  state.convType = type;  const el = document.getElementById('conv-number');  const fmtEl = document.getElementById('conv-format');  const typeEl = document.getElementById('conv-question-type');  if (type === 'dec2hex') {    el.textContent = n.toString(10);    fmtEl.textContent = '10進数 → 16進数 (0x___) で入力';    typeEl.textContent = '10進数 → 16進数';  } else {    el.textContent = '0x' + n.toString(16).toUpperCase();    fmtEl.textContent = '16進数 → 10進数 で入力';    typeEl.textContent = '16進数 → 10進数';  }  document.getElementById('conv-input').value = '';  document.getElementById('conv-input').focus();  document.getElementById('conv-feedback').textContent = '';}function checkConversion() {  const input = document.getElementById('conv-input').value.trim().replace(/^0x/i,'');  if (!input) return;  let correct = false;  if (state.convType === 'dec2hex') {    correct = input.toUpperCase() === state.currentAnswer.toString(16).toUpperCase();  } else {    correct = parseInt(input, 10) === state.currentAnswer;  }  const fb = document.getElementById('conv-feedback');  if (correct) {    state.score++;    document.getElementById('conv-score').textContent = state.score;    fb.innerHTML = '<span class="text-green-400">✓ 正解！</span>'; // xss-ok: computed value    nextConvQuestion();  } else {    const ans = state.convType === 'dec2hex' ? '0x'+state.currentAnswer.toString(16).toUpperCase() : state.currentAnswer.toString(10);    fb.innerHTML = `<span class="text-red-400">✗ 不正解。答えは ${ans}</span>`; // xss-ok: computed value    document.getElementById('conv-input').classList.add('shake');    setTimeout(() => document.getElementById('conv-input').classList.remove('shake'), 400);    showConvTip();    setTimeout(nextConvQuestion, 1800);  }}function showConvTip() {  const tips = [    '💡 16進数は0-9とA-Fの16文字。A=10, B=11, C=12, D=13, E=14, F=15',    '💡 1バイト(8bit) = 0x00〜0xFF (0〜255)',    '💡 0xFF = 1111 1111 = 255 → 全ビットが立った状態',    '💡 16進数1桁 = 4ビット(ニブル)。0xAB → A=1010, B=1011',    '💡 0x10 = 16, 0x100 = 256, 0x1000 = 4096',  ];  const fb = document.getElementById('conv-feedback');  fb.innerHTML += '<br><span class="text-yellow-300">' + tips[Math.floor(Math.random()*tips.length)] + '</span>'; // xss-ok: internal constant}document.addEventListener('keydown', e => {  if (e.key === 'Enter' && !document.getElementById('screen-conversion').classList.contains('hidden') && !document.getElementById('conv-game').classList.contains('hidden')) {    checkConversion();  }  if (e.key === 'Enter' && !document.getElementById('screen-bitwise').classList.contains('hidden') && document.getElementById('bw-breakdown').classList.contains('hidden')) {    checkBitwise();  }});// ===== Bitwise Quiz =====const BW_OPS = ['AND','OR','XOR','NOT','LSHIFT','RSHIFT'];function genBitwiseQ() {  const op = BW_OPS[Math.floor(Math.random() * BW_OPS.length)];  const a = Math.floor(Math.random() * 256);  let b = Math.floor(Math.random() * 8);  let result, display;  if (op === 'NOT') {    result = (~a) & 0xFF;    display = `NOT 0x${a.toString(16).toUpperCase().padStart(2,'0')}`;  } else if (op === 'LSHIFT') {    b = Math.floor(Math.random() * 4) + 1;    result = (a << b) & 0xFF;    display = `0x${a.toString(16).toUpperCase().padStart(2,'0')} << ${b}`;  } else if (op === 'RSHIFT') {    b = Math.floor(Math.random() * 4) + 1;    result = (a >>> b) & 0xFF;    display = `0x${a.toString(16).toUpperCase().padStart(2,'0')} >> ${b}`;  } else {    const bVal = Math.floor(Math.random() * 256);    state.currentB = bVal;    if (op === 'AND') result = a & bVal;    if (op === 'OR')  result = a | bVal;    if (op === 'XOR') result = a ^ bVal;    display = `0x${a.toString(16).toUpperCase().padStart(2,'0')} ${op} 0x${bVal.toString(16).toUpperCase().padStart(2,'0')}`;  }  state.currentA = a;  state.currentOp = op;  state.currentAnswer = result;  return { op, a, b: state.currentB, result, display };}function toBin8(n) { return (n & 0xFF).toString(2).padStart(8,'0'); }function nextBitwiseQuestion() {  if (state.currentQ >= 10) { endGame('bitwise'); return; }  document.getElementById('bw-breakdown').classList.add('hidden');  document.getElementById('bw-feedback').textContent = '';  document.getElementById('bw-input').value = '';  const q = genBitwiseQ();  document.getElementById('bw-op-label').textContent = q.op;  document.getElementById('bw-operands').textContent = q.display;  document.getElementById('bw-qnum').textContent = state.currentQ + 1;  document.getElementById('bw-input').focus();}function checkBitwise() {  const input = document.getElementById('bw-input').value.trim().replace(/^0x/i,'');  if (!input) return;  const userVal = parseInt(input, 16);  const correct = !isNaN(userVal) && userVal === state.currentAnswer;  const fb = document.getElementById('bw-feedback');  if (correct) {    state.score++;    state.correctCount++;    document.getElementById('bw-score').textContent = state.score;    fb.innerHTML = '<span class="text-green-400">✓ 正解！</span>'; // xss-ok: computed value  } else {    fb.innerHTML = `<span class="text-red-400">✗ 不正解。答えは 0x${state.currentAnswer.toString(16).toUpperCase().padStart(2,'0')}</span>`; // xss-ok: computed value  }  state.totalQuestions++;  state.currentQ++;  showBitwiseBreakdown(correct);}function showBitwiseBreakdown(correct) {  const a = state.currentA, op = state.currentOp, ans = state.currentAnswer, b = state.currentB;  let html = '';  if (op === 'NOT') {    html = `<div class="text-gray-400">   A: ${toBin8(a)} (0x${a.toString(16).toUpperCase().padStart(2,'0')})</div><div class="text-yellow-400">NOT: ${toBin8(ans)} (0x${ans.toString(16).toUpperCase().padStart(2,'0')})</div>`;  } else if (op === 'LSHIFT' || op === 'RSHIFT') {    const bits = op === 'LSHIFT' ? parseInt(document.getElementById('bw-operands').textContent.match(/(\d+)$/)?.[1] || '1') : parseInt(document.getElementById('bw-operands').textContent.match(/(\d+)$/)?.[1] || '1');    html = `<div class="text-gray-400">  A:  ${toBin8(a)} (0x${a.toString(16).toUpperCase().padStart(2,'0')})</div><div class="text-yellow-400">結果: ${toBin8(ans)} (0x${ans.toString(16).toUpperCase().padStart(2,'0')})</div>`;  } else {    const opSym = {AND:'&',OR:'|',XOR:'^'}[op];    html = `<div class="text-gray-400">  A:  ${toBin8(a)} (0x${a.toString(16).toUpperCase().padStart(2,'0')})</div><div class="text-gray-400">  B:  ${toBin8(b)} (0x${b.toString(16).toUpperCase().padStart(2,'0')})</div><div class="text-gray-500">  ${op}: ────────────────────</div><div class="text-yellow-400">結果: ${toBin8(ans)} (0x${ans.toString(16).toUpperCase().padStart(2,'0')})</div>`;  }  if (!correct) {    html += `<div class="mt-2 text-cyan-300">💡 ${BIT_TIPS[op]}</div>`;  }  document.getElementById('bw-breakdown-content').innerHTML = html; // xss-ok: computed value  document.getElementById('bw-breakdown').classList.remove('hidden');}// ===== Bit Flags =====function nextFlagQuestion() {  if (state.currentQ >= 8) { endGame('flags'); return; }  document.getElementById('flag-tip').classList.add('hidden');  document.getElementById('flag-feedback').textContent = '';  state.flagTarget = Math.floor(Math.random() * 256);  state.flagBits = new Array(8).fill(0);  document.getElementById('flag-target-hex').textContent = '0x' + state.flagTarget.toString(16).toUpperCase().padStart(2,'0');  document.getElementById('flag-target-bin').textContent = toBin8(state.flagTarget).split('').join(' ');  document.getElementById('flag-qnum').textContent = state.currentQ + 1;  renderFlagBits();}function renderFlagBits() {  const container = document.getElementById('flag-bits');  const labels = document.getElementById('flag-bit-labels');  container.innerHTML = '';  // xss-ok: reviewed-internal-data  labels.innerHTML = '';  // xss-ok: reviewed-internal-data  for (let i = 7; i >= 0; i--) {    const bit = state.flagBits[i];    const btn = document.createElement('button');    btn.className = `bit-cell aspect-square rounded-md font-bold text-lg flex items-center justify-center ${bit ? 'bg-green-500 text-white' : 'bg-gray-700 text-gray-400'} hover:opacity-80 transition`;    btn.textContent = bit ? '1' : '0';    btn.setAttribute('aria-label', `ビット${i} (${FLAG_NAMES[i]}): ${bit ? '1' : '0'}`);    btn.setAttribute('aria-pressed', bit ? 'true' : 'false');    btn.addEventListener('click', () => toggleFlagBit(i));    container.appendChild(btn);    const lbl = document.createElement('div');    lbl.textContent = FLAG_NAMES[i];    labels.appendChild(lbl);  }  const current = state.flagBits.reduce((acc, v, i) => acc | (v << i), 0);  document.getElementById('flag-current').textContent = '0x' + current.toString(16).toUpperCase().padStart(2,'0') + ' (' + current + ')';}function toggleFlagBit(i) {  state.flagBits[i] = state.flagBits[i] ? 0 : 1;  renderFlagBits();}function checkFlags() {  const current = state.flagBits.reduce((acc, v, i) => acc | (v << i), 0);  const fb = document.getElementById('flag-feedback');  if (current === state.flagTar
